name: Build and verify

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick graphicsmagick
      - name: Resolve maintained build dependencies
        run: npm install --package-lock-only --ignore-scripts --save-exact --save-dev sass@latest terser@latest
      - name: Record generated manifests
        run: node -e "for (const name of ['package.json', 'package-lock.json']) console.log('GENERATED_FILE ' + name + ' ' + require('node:fs').readFileSync(name).toString('base64'))"
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node --check scripts/build.mjs && node --check scripts/resize.mjs
      - run: npm test
      - run: npm run build
      - run: bundle install
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: photography-site
          path: _site/
          retention-days: 7
