name: Build and verify

on:
  push:
    branches: [master, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick graphicsmagick
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bundle install
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-artifact@v4
        with:
          name: photography-site
          path: _site/
          retention-days: 7
